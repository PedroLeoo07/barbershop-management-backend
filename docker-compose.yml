version: '3.8'

services:
  # Banco de dados PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: barbearia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: barbearia_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - barbearia_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Aplicação Backend
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: barbearia_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      
      # Database
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: barbearia_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      
      # JWT
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      
      # App
      APP_NAME: Barbearia API
      APP_VERSION: 1.0.0
      
      # Rate Limiting
      RATE_LIMIT_WINDOW: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      
      # CORS
      CORS_ORIGIN: http://localhost:3001,http://localhost:3000
      
      # Password
      BCRYPT_ROUNDS: 12
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - barbearia_network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Opcional: Adminer para gerenciamento do banco
  adminer:
    image: adminer:latest
    container_name: barbearia_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    networks:
      - barbearia_network
    depends_on:
      - database

volumes:
  postgres_data:
    driver: local

networks:
  barbearia_network:
    driver: bridge